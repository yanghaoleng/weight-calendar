limit_req_zone $binary_remote_addr zone=wcal_auth:10m rate=12r/m;

map $request_uri $wcal_cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-store, must-revalidate";
}

server {
    listen 80;
    listen [::]:80;
    server_name wcal.mikeywa.site;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wcal.mikeywa.site;

    ssl_certificate /etc/letsencrypt/live/wcal.mikeywa.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wcal.mikeywa.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/wcal/current/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;

    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    location = /api/accounts {
        limit_req zone=wcal_auth burst=4 nodelay;
        proxy_pass http://127.0.0.1:8141;
        include proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /api/accounts/check-passcode {
        limit_req zone=wcal_auth burst=6 nodelay;
        proxy_pass http://127.0.0.1:8141;
        include proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /api/sessions {
        limit_req zone=wcal_auth burst=4 nodelay;
        proxy_pass http://127.0.0.1:8141;
        include proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /api/admin/session {
        limit_req zone=wcal_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8141;
        include proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8141;
        include proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    location = /index.html { }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header Cache-Control $wcal_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
